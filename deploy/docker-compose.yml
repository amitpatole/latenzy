# latenzy standalone bundle: prober + Prometheus + Grafana, pre-provisioned.
#
#   cd deploy
#   mkdir -p secrets && openssl rand -hex 32 > secrets/latenzy_token
#   export ANTHROPIC_API_KEY=... OPENAI_API_KEY=... GEMINI_API_KEY=...
#   export GRAFANA_ADMIN_PASSWORD=...        # no default on purpose
#   docker compose up -d
#
# Grafana: http://localhost:3000 (anonymous read-only; admin uses the password above)

services:
  latenzy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ./latenzy.yaml:/etc/latenzy/latenzy.yaml:ro
    secrets:
      - latenzy_token
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "9877"

  prometheus:
    image: prom/prometheus:v2.53.0@sha256:b8e8cec4bfdfda676f4334f4f2aab9d8758f51d76ac41fc35224f6ae79b79f54
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    secrets:
      - latenzy_token
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0@sha256:83c197f05ad57b51f5186ca902f0c95fcce45810e7fe738a84cc38f481a2227a
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD - no default password ships with this bundle}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  latenzy_token:
    file: ./secrets/latenzy_token

volumes:
  prometheus-data:
  grafana-data:
