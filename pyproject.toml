[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latenzy"
version = "0.1.0"
description = "Per-model LLM latency monitoring — Prometheus exporter and Grafana dashboards for Claude, OpenAI, and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Amit Patole", email = "amit.patole@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
latenzy = "latenzy.cli:main"

[project.urls]
Homepage = "https://github.com/amitpatole/latenzy"
Documentation = "https://amitpatole.github.io/latenzy/"
Changelog = "https://github.com/amitpatole/latenzy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latenzy"]

[tool.ruff]
line-length = 100
target-version = "py310"
# brand/render_og.py is a build-time asset tool (needs playwright, not a dev dep).
extend-exclude = ["brand"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
